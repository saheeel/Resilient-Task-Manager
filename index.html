<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Primary favicon -->
    <link rel="icon" type="image/svg+xml" href="/resilientlogo.svg" />
    <link rel="shortcut icon" href="/resilientlogo.svg" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple / iOS -->
    <link rel="apple-touch-icon" href="/resilientlogo.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Resilient" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Chrome / Android -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Resilient" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="msapplication-TileColor" content="#0f172a" />
    <meta name="msapplication-TileImage" content="/resilientlogo.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Resilient Operations Dashboard</title>
  </head>
  <body>
    <script>
      window.onerror = function(msg, src, lineno, colno, error) {
        var div = document.createElement('div');
        div.style.cssText = 'position:fixed;top:0;left:0;right:0;background:red;color:white;padding:20px;z-index:99999;font-family:monospace;font-size:12px;';
        div.innerHTML = '<b>Early JS Error:</b><br>' + msg + '<br>' + src + ':' + lineno;
        document.body.appendChild(div);
      };
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
